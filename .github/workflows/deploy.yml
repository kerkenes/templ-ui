# Off-host build: GitHub's free ARM runners build the image, ghcr.io
# stores it, Coolify on the VPS only pulls. The server never compiles
# again. Releases are tagged by hand, this workflow only follows main.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/kerkenes/templ-ui:latest
            ghcr.io/kerkenes/templ-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Coolify pulls the fresh image; the URL is the resource's deploy
      # webhook stored as a repo secret.
      - name: Trigger Coolify deploy
        run: curl -fsS -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}"
