# Off-host build: a GitHub runner builds the image, ghcr.io
# stores it, Coolify on the VPS only pulls. The server never compiles
# again. Releases are tagged by hand, this workflow only follows main.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kerkenes/templ-ui:latest
            ghcr.io/kerkenes/templ-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Coolify pulls the fresh image. The URL is the resource's deploy
      # webhook and the token an API token with the deploy permission:
      # the endpoint changes state, so it takes POST and refuses an
      # unauthenticated call with a 401.
      - name: Trigger Coolify deploy
        run: |
          curl -fsS -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
