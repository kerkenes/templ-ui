version: "3"

tasks:
  # Development Tools
  templ:
    desc: Run templ with integrated server and hot reload
    env:
      # Rebases every self-referencing templ-ui.muratkirazkaya.com URL (docs, llms.txt,
      # sitemap, robots) onto the local origin, see shared.Rebase.
      BASE_URL: http://localhost:8090
    cmds:
      - go tool templ generate --watch --proxy="http://localhost:8090" --cmd="go run ./cmd/docs/main.go" --open-browser=false

  shiki-highlighter:
    desc: Start shiki syntax highlighter service
    dir: shiki
    cmds:
      - npm start

  tailwind-clean:
    desc: Clean tailwind output
    cmds:
      - "npx @tailwindcss/cli -i ./assets/css/docs.css -o ./assets/css/output.css --clean"

  tailwind-watch:
    desc: Run tailwindcss in watch mode
    cmds:
      - "npx @tailwindcss/cli -i ./assets/css/docs.css -o ./assets/css/output.css --watch"

  kill-ports:
    desc: Kill leftover processes on the dev ports (8090 app, 7331 templ proxy, 3000 shiki)
    cmds:
      # kill-port over lsof: lsof does not exist on Windows, where this task
      # used to fail the whole dev run.
      - cmd: npx kill-port 8090 7331 3000
        ignore_error: true

  dev:
    desc: Start development server with hot reload
    deps:
      - kill-ports
      - tailwind-clean
    cmds:
      - task --parallel tailwind-watch templ shiki-highlighter

  # Build & Validation
  build-css:
    desc: Compile assets/css/templ-ui.css, the stylesheet shipped to library consumers (scans components/ only, no docs sources)
    cmds:
      - npx @tailwindcss/cli --cwd components -i ../assets/css/globals.css -o ../assets/css/templ-ui.css --minify

  templ-generate:
    desc: Compile templ files into Go
    cmds:
      - go tool templ generate

  # Generators
  generate-sitemap:
    desc: Generate sitemap.xml
    cmds:
      - go run ./cmd/sitemap/main.go --baseurl="https://templ-ui.muratkirazkaya.com" --output="./static/sitemap.xml"

  generate-icons:
    desc: Generate icon definitions
    cmds:
      - go run cmd/icongen/main.go

  generate-llms:
    desc: Generate llms.txt from registry.json
    cmds:
      - go run cmd/generate-llms/main.go

  generate-style-classes:
    desc: Generate assets/css/style-classes.txt (Tailwind scan candidates for the compiled docs previews) from the vendored style css
    cmds:
      - go run ./cmd/generate-style-classes
